# minimaxcode2api HTTPS 入口
# 证书：acme.sh（Let's Encrypt），HTTP-01（DNS 已指向本机），自动续期并 reload nginx。
#
# ⚠️ 本文件被 nginx 在 **http 块内** include ⇒ `limit_req_zone` 可以写在这里（server 之外）。
#    zone 名带站点前缀防与其他 vhost 重名。
limit_req_zone $binary_remote_addr zone=mmx2a_edge:10m rate=1200r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name minimaxcode.1task.cn;

    ssl_certificate     /www/server/panel/vhost/cert/minimaxcode.1task.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/minimaxcode.1task.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/minimaxcode.1task.cn.log;
    error_log  /www/wwwlogs/minimaxcode.1task.cn.error.log;

    # 入口层不做 basic auth：/v1 是给客户端直连的 API，加 basic auth 会破坏 OpenAI 兼容契约。
    # 面板防护 = 预置管理员密码 + 登录门 + 下面这层洪水闸门。
    auth_basic off;

    location / {
        # 洪水闸门（不是鉴权）：20r/s 持续 + 200 突发。
        # 生成类接口本身很慢，正常调用远到不了这个量级；闸门只挡扫面板/爆破。
        limit_req zone=mmx2a_edge burst=200 nodelay;
        limit_req_status 429;
        include /www/server/panel/vhost/nginx/minimaxcode-proxy.inc;
    }
}
